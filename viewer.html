<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>观看直播</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0f0f0f;
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 24px;
  }
  .player-wrapper {
    width: 100%;
    max-width: 960px;
    border-radius: 12px;
    overflow: hidden;
    background: #000;
    border: 1px solid #222;
  }
  video {
    width: 100%;
    display: block;
  }
  .status {
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #555;
    transition: background 0.3s;
  }
  .status-dot.waiting { background: #f59e0b; }
  .status-dot.live { background: #22c55e; }
  .status-text { color: #888; }
</style>
</head>
<body>
  <div class="player-wrapper">
    <video id="video" autoplay playsinline controls></video>
  </div>

  <div class="status">
    <span class="status-dot waiting" id="statusDot"></span>
    <span class="status-text" id="statusText">等待主播上线...</span>
  </div>

<script>
const PORT = location.port || '8080';
const video = document.getElementById('video');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');

let mediaSource = null;
let sourceBuffer = null;
let ws = null;
let pendingChunks = [];
let everPlayed = false;
let reconnectAttempts = 0;
const MAX_RECONNECT = 10;

function connect() {
  const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${protocol}//${location.hostname}:${PORT}/viewer`);
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => {
    reconnectAttempts = 0;
    statusText.textContent = '已连接，等待视频流...';
  };
  ws.onmessage = (e) => {
    if (!everPlayed) {
      everPlayed = true;
      statusDot.className = 'status-dot live';
      statusText.textContent = '直播中';
    }
    if (sourceBuffer && !sourceBuffer.updating && mediaSource.readyState === 'open') {
      try {
        sourceBuffer.appendBuffer(new Uint8Array(e.data));
      } catch (_) { /* QuotaExceededError or similar */ }
    } else {
      pendingChunks.push(new Uint8Array(e.data));
    }
  };
  ws.onclose = () => {
    pendingChunks = [];
    if (reconnectAttempts >= MAX_RECONNECT) {
      statusDot.className = 'status-dot waiting';
      statusText.textContent = '连接失败，请刷新页面重试';
      return;
    }
    const delay = Math.min(1000 * Math.pow(2, reconnectAttempts), 30000);
    reconnectAttempts++;
    statusDot.className = 'status-dot waiting';
    statusText.textContent = `连接断开，${Math.round(delay / 1000)}秒后重连...`;
    setTimeout(connect, delay);
  };
  ws.onerror = () => ws.close();
}

function setupMediaSource() {
  if (mediaSource && mediaSource.readyState !== 'closed') {
    try { mediaSource.endOfStream(); } catch (_) {}
  }
  mediaSource = new MediaSource();
  video.src = URL.createObjectURL(mediaSource);

  mediaSource.addEventListener('sourceopen', () => {
    try {
      sourceBuffer = mediaSource.addSourceBuffer('video/webm;codecs=vp8');
    } catch (e) {
      statusDot.className = 'status-dot waiting';
      statusText.textContent = '浏览器不支持该视频格式';
      return;
    }
    sourceBuffer.addEventListener('error', () => {
      statusDot.className = 'status-dot waiting';
      statusText.textContent = '播放出错，正在重连...';
      if (mediaSource.readyState === 'open') {
        mediaSource.endOfStream();
      }
      URL.revokeObjectURL(video.src);
      setupMediaSource();
    });
    sourceBuffer.addEventListener('updateend', () => {
      if (pendingChunks.length > 0 && !sourceBuffer.updating) {
        try {
          sourceBuffer.appendBuffer(pendingChunks.shift());
        } catch (_) {}
      }
    });
    connect();
  });
}

setupMediaSource();

video.addEventListener('error', () => {
  statusDot.className = 'status-dot waiting';
  statusText.textContent = '视频播放出错';
});

window.addEventListener('beforeunload', () => {
  if (ws) { ws.onclose = null; ws.onerror = null; ws.close(); }
  if (video.src) URL.revokeObjectURL(video.src);
});
</script>
</body>
</html>
