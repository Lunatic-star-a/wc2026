*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--font-body);background:var(--navy);color:var(--text);overflow-x:hidden;line-height:1.6;min-height:100vh;}

body::after{content:'';position:fixed;top:-30%;left:50%;transform:translateX(-50%);width:1200px;height:800px;background:radial-gradient(ellipse,var(--glow-green) 0%,transparent 70%);pointer-events:none;z-index:0;opacity:0.6;}
.container{max-width:980px;margin:0 auto;padding:0 24px;position:relative;z-index:1;}
nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(10,14,23,0.85);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.06);}
.nav-inner{max-width:1320px;margin:0 auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:60px;}
.nav-logo{font-family:var(--font-display);font-size:28px;letter-spacing:2px;color:var(--gold);text-transform:uppercase;cursor:pointer;text-decoration:none;transition:text-shadow 0.3s;}
.nav-logo:hover{text-shadow:0 0 20px var(--glow-gold);}
.nav-back{color:var(--text-dim);text-decoration:none;font-size:13px;font-weight:500;letter-spacing:1px;transition:color 0.25s;}
.nav-back:hover{color:var(--gold);}
.page-wrap{padding-top:84px;padding-bottom:60px;}
/* match card */
@keyframes livePulse{0%,100%{box-shadow:0 0 0 0 rgba(212,168,67,0.18)}50%{box-shadow:0 0 0 6px rgba(212,168,67,0)}}
@keyframes scoreBlink{0%,100%{opacity:1}50%{opacity:0.55}}
.match-card{background:var(--card);border:1px solid rgba(255,255,255,0.04);border-radius:var(--radius);padding:14px 20px;display:grid;grid-template-columns:100px 1fr auto;align-items:center;gap:12px;transition:all 0.3s ease;position:relative;overflow:visible;margin-bottom:10px;}
.match-card::after{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--pitch);transform:scaleY(0);transition:transform 0.3s ease;}
.match-card:hover::after{transform:scaleY(1);}
.match-card:hover{border-color:rgba(255,255,255,0.1);box-shadow:0 8px 32px rgba(0,0,0,0.2);}
.match-card.live{border-color:rgba(212,168,67,0.3);animation:livePulse 2s ease-in-out infinite;}
.match-card.finished{opacity:0.75;}
.match-date{font-family:var(--font-mono);font-size:12px;color:var(--text-dim);}
.match-date strong{display:block;color:var(--text);font-size:14px;margin-top:1px;}
.match-info{text-align:center;min-width:0;}
.match-teams{font-family:var(--font-display);font-size:20px;letter-spacing:1px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;}
.match-vs{color:var(--text-dim);font-family:var(--font-body);font-size:12px;font-weight:400;}
.match-venue{font-size:11px;color:var(--text-dim);margin-top:3px;}
.match-actions{display:flex;flex-direction:column;gap:4px;align-items:center;min-width:84px;}
.match-live-badge{font-size:10px;color:var(--accent-red);margin-left:6px;display:inline-flex;align-items:center;gap:3px}
.live-dot-sm{width:6px;height:6px;border-radius:50%;background:var(--accent-red);display:inline-block}
.match-finished-badge{font-size:10px;color:var(--text-dim);margin-left:6px}
.match-status-row{white-space:nowrap;font-size:10px;margin-top:2px;text-align:center}
.match-result-score{font-family:var(--font-mono);font-size:14px;font-weight:700;color:#fff;letter-spacing:1px;background:rgba(255,255,255,0.06);padding:2px 8px;border-radius:5px}
.match-data-link{font-family:var(--font-mono);font-size:9px;letter-spacing:1px;color:var(--pitch-bright);text-decoration:none;padding:3px 10px;border:1px solid rgba(13,140,60,0.3);border-radius:100px;transition:all 0.2s;white-space:nowrap;}
.match-data-link:hover{background:rgba(13,140,60,0.2);}
/* my-team sections */
.myteam-header{background:linear-gradient(135deg,rgba(212,168,67,0.15),rgba(13,140,60,0.1));padding:32px 24px 24px;text-align:center;position:relative;border-radius:var(--radius);border:1px solid rgba(255,255,255,0.05);margin-bottom:18px}
.myteam-header-name{font-family:var(--font-display);font-size:36px;letter-spacing:2px;color:#fff;margin-top:6px}
.myteam-header-en{color:var(--text-dim);font-size:13px;margin-top:2px}
.myteam-header-meta{display:flex;justify-content:center;gap:18px;margin-top:10px;flex-wrap:wrap}
.myteam-header-meta span{font-size:11px;color:var(--text-dim)}
.myteam-header-meta b{color:var(--gold);font-family:var(--font-mono)}
.myteam-edit{font-size:11px;color:var(--text-dim);margin-top:12px;cursor:pointer;text-decoration:none;display:inline-block}
.myteam-edit:hover{color:var(--gold)}
.myteam-body{display:flex;flex-direction:column;gap:16px}
.myteam-card{background:var(--card);border:1px solid rgba(255,255,255,0.04);border-radius:var(--radius);overflow:hidden}
.myteam-card-header{padding:14px 18px;background:rgba(255,255,255,0.02);border-bottom:1px solid rgba(255,255,255,0.04);font-family:var(--font-display);font-size:15px;letter-spacing:1px;display:flex;align-items:center;gap:8px;color:#fff}
.myteam-card-body{padding:16px 18px;font-size:13px;color:var(--text-dim);line-height:1.7}
.myteam-ai-text{white-space:pre-line}
.myteam-player-table{width:100%;border-collapse:collapse;font-size:12px}
.myteam-player-table th{text-align:left;padding:9px 8px;border-bottom:1px solid rgba(255,255,255,0.06);color:var(--text-dim);font-weight:500;font-size:10px;text-transform:uppercase;letter-spacing:1px;position:sticky;top:0;background:var(--card)}
.myteam-player-table td{padding:9px 8px;border-bottom:1px solid rgba(255,255,255,0.03);color:var(--text)}
.myteam-player-table tr:hover td{background:rgba(255,255,255,0.02)}
.myteam-pos-tag{display:inline-block;font-size:10px;padding:1px 7px;border-radius:100px;background:rgba(212,168,67,0.12);color:var(--gold)}
.myteam-jersey{font-family:var(--font-mono);font-weight:700;color:var(--gold);width:34px;text-align:center}
.myteam-news-item{padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.03);cursor:pointer}
.myteam-news-item:last-child{border-bottom:none}
.myteam-news-title{font-size:13px;color:#fff;margin-bottom:4px}
.myteam-news-snippet{font-size:11px;color:var(--text-dim)}
.myteam-news-full{font-size:12px;color:var(--text-dim);line-height:1.6;margin-top:8px;display:none;padding-top:8px;border-top:1px solid rgba(255,255,255,0.04)}
.squad-note{font-size:11px;color:var(--text-dim);margin-top:10px;padding-top:10px;border-top:1px dashed rgba(255,255,255,0.06)}
.data-loading-spinner{width:28px;height:28px;border:3px solid rgba(212,168,67,0.2);border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.center-pad{text-align:center;padding:40px;color:var(--text-dim)}
@media(max-width:640px){

  .match-actions{flex-direction:row;justify-content:center;flex-wrap:wrap}
  .myteam-header-name{font-size:28px}
  .myteam-player-table{font-size:11px}
  .myteam-player-table th,.myteam-player-table td{padding:7px 5px}
}

function resolveStatus(s,matchObj){

    if(elapsed>150)return'finished';
    if(elapsed<=0)return'upcoming';
    if(s.match_minute>=45&&s.match_minute<90)return'live';

  }

}

async function pollScores(onDone){
  try{
    var fmt=Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai'});
    var today=fmt.format(new Date()).replace(/-/g,'');
    var yesterday=fmt.format(new Date(Date.now()-864e5)).replace(/-/g,'');
    var events=[];
    for(var di=0;di<2;di++){
      var dt=di===0?today:yesterday;
      var resp=await fetch('https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/scoreboard?dates='+dt);
      if(resp.ok){var j=await resp.json();if(j.events)events=events.concat(j.events);}
    }
    var changed=false;
    for(var ei=0;ei<events.length;ei++){
      var evt=events[ei];var comps=evt.competitions[0];
      if(!comps||comps.competitors.length<2)continue;
      var h=comps.competitors[0],a=comps.competitors[1];
      var hcn=_espnTeamToCN((h.team.displayName||'').toLowerCase().trim());
      var acn=_espnTeamToCN((a.team.displayName||'').toLowerCase().trim());
      var hs=parseInt(h.score)||0,as=parseInt(a.score)||0;
      var stInfo=evt.status,stType=stInfo.type.name||'';
      var dbSt='upcoming',period=stInfo.period||0,clock=stInfo.displayClock||'';
      if(stType==='STATUS_FULL_TIME'||stType==='STATUS_FINAL')dbSt='finished';
      else if(stType==='STATUS_HALF_TIME'||stType==='STATUS_END_OF_PERIOD')dbSt='halftime';
      else if(stType==='STATUS_IN_PROGRESS'||stType==='STATUS_SECOND_HALF'||stType==='STATUS_FIRST_HALF'||stType==='STATUS_DELAYED'||stType==='STATUS_RAIN_DELAY')dbSt='live';
      else dbSt='upcoming';
      var min=0,inj=0,cm=clock.match(/(\d+)'?\s*\+?\s*(\d*)'?/);
      if(cm){min=parseInt(cm[1]);inj=cm[2]?parseInt(cm[2]):0;}
      else{var nums=clock.match(/\d+/);if(nums)min=parseInt(nums[0]);}
      if(period===2&&min>0&&min<45){inj=min;min=45;}
      if(dbSt==='upcoming'&&hs===0&&as===0&&(clock==='0'||clock==="0'"||!clock))continue;
      var dbId=null;
      for(var mi=0;mi<ALL_MATCHES.length;mi++){var mm=ALL_MATCHES[mi];if(mm.home===hcn&&mm.away===acn){dbId=mi+1;break;}}
      if(!dbId)continue;
      var old=matchScores[dbId]||{};
      if(old.status==='finished')continue;
      if(dbSt==='live'){
        var cl=clock.toLowerCase();
        if(cl.indexOf('ht')>=0||cl.indexOf('half')>=0)dbSt='halftime';
      }
      if(dbSt==='live'&&old.status==='halftime'&&period===1&&min<45)dbSt='halftime';
      var nh=hs+'-'+as+':'+dbSt+':'+min+':'+inj;
      var oh=(old.home_score!=null?old.home_score:'')+'-'+(old.away_score!=null?old.away_score:'')+':'+(old.status||'')+':'+(old.match_minute!=null?old.match_minute:'')+':'+(old.injury_time!=null?old.injury_time:'');
      if(nh===oh)continue;
      matchScores[dbId]={home_score:hs,away_score:as,status:dbSt,match_minute:min,injury_time:inj};
      changed=true;
    }
    if(changed&&typeof onDone==='function')onDone();
  }catch(e){}
}

async function loadTeamNews(teamName){
  var newsBody=document.getElementById('myTeamNewsBody');
  if(!newsBody)return;
  var cached=TEAM_NEWS_CACHE[teamName];
  if(cached&&cached.length>0){renderNewsCards(newsBody,cached);return;}
  newsBody.innerHTML='<div style="color:var(--text-dim);text-align:center;padding:10px">暂无'+teamName+'相关资讯<br><span style="font-size:10px">实时资讯接入后将自动更新，敬请期待</span></div>';
}
function renderNewsCards(container,newsItems){
  if(!newsItems||newsItems.length===0){container.innerHTML='<div style="color:var(--text-dim);text-align:center;padding:10px">暂无相关资讯</div>';return;}
  var html='';
  for(var i=0;i<newsItems.length;i++){
    var item=newsItems[i];var id='news-'+i+'-'+Date.now();
    html+='<div class="myteam-news-item" onclick="toggleNews(\''+id+'\')"><div class="myteam-news-title">'+(item.title||'')+'</div><div class="myteam-news-snippet">'+(item.snippet||'')+'</div><div class="myteam-news-full" id="'+id+'"><div style="color:var(--text-dim);font-size:11px">点击查看原文：<a href="'+(item.url||'#')+'" target="_blank" rel="noopener" style="color:var(--gold)">'+(item.url||'#')+'</a></div></div></div>';
  }
  container.innerHTML=html;
}
function toggleNews(id){var el=document.getElementById(id);if(!el)return;el.style.display=el.style.display==='block'?'none':'block';}

/* ════════ AI static analysis (DeepSeek-ready framework) ════════ */
function generateStaticAnalysis(teamName,info){
  var group=GROUPS.find(function(g){return g.teams.some(function(t){return t.name===teamName;});});
  var groupName=group?group.name:'?';
  var opponents=group?group.teams.filter(function(t){return t.name!==teamName;}):[];
  var avgAge=info.players.reduce(function(s,p){return s+(p.age||25);},0)/Math.max(1,info.players.length);
  var lines=[];
  lines.push('【球队概况】');
  lines.push(teamName+'（'+info.en+'）目前FIFA排名第'+info.rank+'位，所属'+info.conf+'足联。世界杯历史最佳战绩：'+info.best+'，第'+info.apps+'次参赛。');
  lines.push('');
  lines.push('【小组形势】');
  if(opponents.length>0){
    lines.push(teamName+'分在'+groupName+'组，同组对手包括：'+opponents.map(function(t){return t.name+'（FIFA#'+t.rank+'）';}).join('、')+'。根据FIFA排名和球队实力分析，'+teamName+'在小组中的竞争力'+(info.rank<=Math.min.apply(null,opponents.map(function(t){return t.rank;}))?'较强':'一般')+'。');
  }else{
    lines.push(teamName+'已进入淘汰赛阶段，将面对更强的对手挑战。');
  }
  lines.push('');
  lines.push('【前景预测】');
  if(info.rank<=20)lines.push('作为世界排名前20的球队，'+teamName+'有望在小组中取得出线资格，甚至冲击更深轮次。球队整体实力和大赛经验将是最重要的优势。');
  else if(info.rank<=40)lines.push('排名中间梯队的'+teamName+'争取小组出线是现实目标。若能在关键比赛中把握机会，有望晋级淘汰赛。');
  else lines.push('作为排名较低的球队，'+teamName+'需要在小组赛中打出超常表现才能争取出线。无论如何，世界杯的每一场比赛都是宝贵的经历。');
  lines.push('');
  lines.push('（注：以上为基于数据的静态分析，DeepSeek AI 深度分析功能即将上线）');
  return lines.join('\n');
}

/* ════════════════════════════════════════
   DeepSeek AI integration point (TODO)
   Swap generateStaticAnalysis(...) for getAIAnalysis(...)
   once /api/analyze proxy + DEEPSEEK_API_KEY are live.
   ════════════════════════════════════════ */
async function getAIAnalysis(teamName,info){
  try{
    var resp=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({team:teamName,en:info.en,rank:info.rank,group:(GROUPS.find(g=>g.teams.some(t=>t.name===teamName))||{}).name})});
    if(resp.ok){var j=await resp.json();if(j&&j.text)return j.text;}
  }catch(e){}
  return generateStaticAnalysis(teamName,info); // graceful fallback
}

/* ════════ Squad fetch (ESPN roster) ════════ */
async function fetchSquad(teamName){
  var id=TEAM_ESPN_ID[teamName];
  if(!id)return null;
  try{
    var rj=await (await fetch('https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/teams/'+id+'/roster')).json();
    var ath=rj.athletes||[];var flat=[];
    ath.forEach(function(g){if(g.items)flat=flat.concat(g.items);else flat.push(g);});
    if(!flat.length)return null;
    return flat.map(function(p){
      return {num:p.jersey||'',name:(p.displayName||p.fullName||'').trim(),pos:((p.position&&(p.position.abbreviation||p.position.name))||'').trim(),age:p.age||''};
    });
  }catch(e){return null;}
}

/* ════════ Renderers ════════ */
function renderScheduleCard(m){
  var dbId=ALL_MATCHES.indexOf(m)+1;
  var ms=matchScores[dbId];
  var hInfo=TEAM_INFO[m.home],aInfo=TEAM_INFO[m.away];
  var hFlag=hInfo?flagImg(hInfo.cc,26):'';var aFlag=aInfo?flagImg(aInfo.cc,26):'';
  var fm=ms?formatMatchStatus(m,ms):{status:'upcoming',statusBadge:'',minuteHTML:'',scoreColor:''};
  var scoreHTML;
  if(fm.status==='finished'||fm.status==='live'||fm.status==='halftime'){
    if(ms&&ms.home_score!=null)scoreHTML='<span class="match-result-score" style="'+(fm.scoreColor||'')+'">'+ms.home_score+' : '+ms.away_score+'</span>';
    else scoreHTML='<span class="match-result-score">— : —</span>';
  }else{
    scoreHTML='<span style="font-size:13px;color:var(--text-dim);font-family:var(--font-mono)">'+m.time+'</span>';
  }
  var combined=fm.minuteHTML?fm.statusBadge+' '+fm.minuteHTML:fm.statusBadge;
  var liveCls=(fm.status==='live'||fm.status==='halftime')?' live':(fm.status==='finished'?' finished':'');
  var link='<a class="match-data-link" href="/worldcuppro" title="在首页查看数据 / 预测 / 聊天">'+((fm.status==='upcoming')?'✎ 去预测':'📊 首页详情')+'</a>';
  return '<div class="match-card'+liveCls+'"><div class="match-date"><strong>'+m.date+'</strong>'+m.time+' 北京时间</div><div class="match-info"><div class="match-teams">'+hFlag+' '+m.home+'<span class="match-vs">VS</span>'+aFlag+' '+m.away+'</div><div class="match-venue">'+m.venue+(m.group?' · '+m.group+'组':'')+'</div></div><div class="match-actions">'+scoreHTML+link+'<div class="match-status-row">'+combined+'</div></div></div>';
}
function renderSchedule(teamName){
  var matches=ALL_MATCHES.filter(function(m){return m.home===teamName||m.away===teamName;});
  matches.sort(function(a,b){return getMatchTimestamp(a)-getMatchTimestamp(b);});
  if(!matches.length)return '<div class="center-pad">暂无赛程</div>';
  return matches.map(renderScheduleCard).join('');
}
function renderSquadTable(players,teamName){
  var info=TEAM_INFO[teamName];
  var clubByName={};
  if(info&&info.players)info.players.forEach(function(p){clubByName[p.n]=p.club;});
  players.sort(function(a,b){var pa=posOrder(a.pos),pb=posOrder(b.pos);if(pa!==pb)return pa-pb;return (parseInt(a.num)||99)-(parseInt(b.num)||99);});
  var rows=players.map(function(p){
    var club=clubByName[p.name]?clubCN(clubByName[p.name]):'—';
    return '<tr><td class="myteam-jersey">'+(p.num||'—')+'</td><td>'+getPlayerDisplayName(p.name)+'</td><td><span class="myteam-pos-tag">'+posCN(p.pos)+'</span></td><td>'+(p.age||'—')+'</td><td>'+club+'</td></tr>';
  }).join('');
  return '<div style="overflow-x:auto"><table class="myteam-player-table"><thead><tr><th>号码</th><th>姓名</th><th>位置</th><th>年龄</th><th>俱乐部</th></tr></thead><tbody>'+rows+'</tbody></table></div><div class="squad-note">名单来自 ESPN 实时数据（共 '+players.length+' 人）。俱乐部信息暂仅覆盖核心球员，完整俱乐部归属需接入付费数据源（详见下方说明）。</div>';
}

/* ════════ Page build ════════ */
function buildPage(teamName){
  var info=TEAM_INFO[teamName];
  var html='';
  html+='<div class="myteam-header"><div>'+flagImg(info.cc,52)+'</div><div class="myteam-header-name">'+teamName+'</div><div class="myteam-header-en">'+info.en+'</div><div class="myteam-header-meta"><span>FIFA排名 <b>#'+info.rank+'</b></span><span>所属 <b>'+info.conf+'</b></span><span>最佳战绩 <b>'+info.best+'</b></span></div><a class="myteam-edit" href="/worldcuppro">✎ 修改主队</a></div>';
  html+='<div class="myteam-body">';
  html+='<div class="myteam-card"><div class="myteam-card-header">📊 AI 分析预测</div><div class="myteam-card-body"><div class="myteam-ai-text">'+generateStaticAnalysis(teamName,info)+'</div></div></div>';
  html+='<div class="myteam-card"><div class="myteam-card-header">👥 球员信息</div><div class="myteam-card-body" id="squadBody"><div class="center-pad"><div class="data-loading-spinner"></div><p style="margin-top:8px">加载大名单…</p></div></div></div>';
  html+='<div class="myteam-card"><div class="myteam-card-header">📅 赛程安排</div><div class="myteam-card-body" style="padding:14px"><div id="scheduleBody">'+renderSchedule(teamName)+'</div></div></div>';
  html+='<div class="myteam-card"><div class="myteam-card-header">📰 最新资讯</div><div class="myteam-card-body" id="myTeamNewsBody"><div class="center-pad" style="padding:14px">加载资讯中…</div></div></div>';
  html+='</div>';
  document.getElementById('content').innerHTML=html;

  // squad (async)
  fetchSquad(teamName).then(function(players){
    var body=document.getElementById('squadBody');if(!body)return;
    if(players&&players.length){body.innerHTML=renderSquadTable(players,teamName);}
    else{
      // fallback to curated stars
      var cur=(info.players||[]).map(function(p){return {num:p.num,name:p.n,pos:p.pos,age:p.age};});
      body.innerHTML=cur.length?renderSquadTable(cur,teamName)+'<div class="squad-note">⚠ 实时名单暂不可用，已显示核心球员。</div>':'<div class="center-pad">名单暂不可用</div>';
    }
  });
  // news
  loadTeamNews(teamName);
  // live scores
  pollScores(function(){var sb2=document.getElementById('scheduleBody');if(sb2)sb2.innerHTML=renderSchedule(teamName);});
  setInterval(function(){pollScores(function(){var sb2=document.getElementById('scheduleBody');if(sb2)sb2.innerHTML=renderSchedule(teamName);});},30000);
}

async function main(){
  // seed known finished scores so finished matches show before polling
  for(var id in KNOWN_FINISHED){matchScores[parseInt(id)]=KNOWN_FINISHED[id];}
  var team=new URLSearchParams(location.search).get('team');
  if(!team||!TEAM_INFO[team]){location.replace('/worldcuppro');return;}
  document.title=team+' — 我的主队 · WC2026';
  // login check (graceful in local mode)
  if(SUPABASE_READY){
    try{
      var{data}=await sb.auth.getSession();
      if(data&&data.session&&data.session.user){currentUser={id:data.session.user.id};}
      else{location.replace('/worldcuppro');return;}
    }catch(e){/* allow view on session error */}
  }
  buildPage(team);
}
main();
