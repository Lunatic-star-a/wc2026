name: Live Score Poller

on:
  schedule:
    - cron: '* * * * *'       # every minute
  workflow_dispatch:           # manual trigger from GitHub UI
  push:
    paths:
      - '.github/scripts/poll_scores.py'  # test on script change

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      - name: Poll ESPN API and update Supabase
        run: python3 .github/scripts/poll_scores.py
