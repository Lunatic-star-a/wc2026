<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>比赛数据 — FIFA World Cup 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ════════════════════════════════════════════════════
   Design tokens — 沿用 worldcuppro.html 深色主题
   ════════════════════════════════════════════════════ */
:root {
  --pitch:#0d8c3c;--pitch-deep:#0a5c2a;--pitch-bright:#0fa84a;
  --gold:#d4a843;--gold-bright:#f5c542;
  --navy:#0a0e17;--slate:#141a26;--card:#151d2b;--card-hover:#1a2333;
  --text:#e8edf2;--text-dim:#7d8899;--accent-red:#c0392b;
  --glow-green:rgba(13,140,60,0.35);--glow-gold:rgba(212,168,67,0.3);
  --radius:10px;--radius-sm:6px;
  --font-display:'Bebas Neue',sans-serif;
  --font-body:'DM Sans',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:var(--font-body);background:var(--navy);color:var(--text);
  overflow-x:hidden;line-height:1.6;
}
body::before{content:'';position:fixed;inset:0;
  background:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events:none;z-index:0;
}
body::after{content:'';position:fixed;top:-30%;left:50%;transform:translateX(-50%);
  width:1200px;height:800px;
  background:radial-gradient(ellipse,var(--glow-green) 0%,transparent 70%);
  pointer-events:none;z-index:0;opacity:0.6;
}
.container{max-width:900px;margin:0 auto;padding:0 20px;position:relative;z-index:1}

/* ═══ 导航栏 ═══ */
nav{position:sticky;top:0;z-index:100;background:rgba(10,14,23,0.88);
  backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.06);}
.nav-inner{max-width:900px;margin:0 auto;padding:0 20px;display:flex;
  align-items:center;justify-content:space-between;height:52px;}
.nav-logo{font-family:var(--font-display);font-size:24px;
  letter-spacing:2px;color:var(--gold);text-transform:uppercase;
  cursor:pointer;text-decoration:none;transition:text-shadow 0.3s;}
.nav-logo:hover{text-shadow:0 0 20px var(--glow-gold);}
.nav-back{color:var(--text-dim);text-decoration:none;font-size:12px;
  text-transform:uppercase;letter-spacing:1px;transition:color 0.25s;}
.nav-back:hover{color:var(--gold);}

/* ═══ 比赛选择器 ═══ */
.selector-section{padding:20px 0 0}
.match-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.match-tab{font-family:var(--font-mono);font-size:10px;letter-spacing:1px;
  padding:8px 14px;border-radius:100px;cursor:pointer;border:1px solid rgba(255,255,255,0.1);
  background:var(--card);color:var(--text-dim);transition:all 0.25s;}
.match-tab:hover{background:var(--card-hover);color:#fff;}
.match-tab.active{background:var(--pitch);color:#fff;border-color:var(--pitch);}
.match-tab.live{display:flex;align-items:center;gap:5px}
.match-tab .tab-dot{width:5px;height:5px;border-radius:50%;background:var(--accent-red);
  animation:livePulseSm 1s ease-in-out infinite}

/* ═══ 比赛头部 ═══ */
.match-header{background:var(--card);border:1px solid rgba(255,255,255,0.06);
  border-radius:var(--radius);padding:20px;margin-bottom:16px;}
.match-header-top{text-align:center;margin-bottom:12px}
.match-stage{font-family:var(--font-mono);font-size:10px;letter-spacing:2px;
  color:var(--text-dim);text-transform:uppercase;}
.match-teams-row{display:flex;align-items:center;justify-content:center;gap:16px}
.team-col{flex:1;text-align:center}
.team-col .flag{font-size:36px;display:block}
.team-col .name{font-size:14px;font-weight:600;margin-top:4px;color:var(--text)}
.score-col{flex:0 0 auto;text-align:center}
.score-box{font-family:var(--font-mono);font-size:36px;font-weight:700;color:var(--gold);
  padding:6px 16px;background:rgba(212,168,67,0.1);border-radius:8px;
  border:2px solid rgba(212,168,67,0.3);min-width:80px}
.score-box.live{border-color:var(--pitch-bright);animation:scoreBreath 1.5s ease-in-out infinite}
.match-meta{display:flex;justify-content:center;gap:20px;margin-top:10px;
  font-size:11px;color:var(--text-dim);flex-wrap:wrap}

/* ═══ 统计区域 ═══ */
.stats-card{background:var(--card);border:1px solid rgba(255,255,255,0.06);
  border-radius:var(--radius);padding:18px;margin-bottom:14px;}
.stats-card h3{font-family:var(--font-display);font-size:15px;letter-spacing:1px;
  color:var(--gold);margin-bottom:14px;text-transform:uppercase;}
.stats-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  gap:8px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.03);}
.stats-val-h{text-align:right;font-family:var(--font-mono);font-size:14px;font-weight:700;}
.stats-val-a{text-align:left;font-family:var(--font-mono);font-size:14px;font-weight:700;}
.stats-bar-wrap{position:relative;height:6px;background:rgba(255,255,255,0.05);border-radius:3px;}
.stats-bar-h{position:absolute;left:0;top:0;height:100%;background:var(--pitch);
  border-radius:3px;transition:width 0.6s ease;}
.stats-bar-a{position:absolute;right:0;top:0;height:100%;background:var(--gold);
  border-radius:3px;transition:width 0.6s ease;}
.stats-vs{font-family:var(--font-mono);font-size:10px;color:var(--text-dim);
  padding:0 6px;text-align:center;min-width:30px}

/* ═══ 阵容 ═══ */
.lineups-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.lineup-col{background:var(--slate);border:1px solid rgba(255,255,255,0.06);
  border-radius:var(--radius);padding:16px;}
.lineup-col h4{font-family:var(--font-display);font-size:13px;letter-spacing:1px;
  color:var(--text);margin-bottom:6px;display:flex;align-items:center;gap:6px;}
.lineup-col h4 .fm{font-family:var(--font-mono);font-size:10px;color:var(--text-dim);
  background:rgba(255,255,255,0.05);padding:2px 8px;border-radius:20px;}
.lineup-list{display:flex;flex-wrap:wrap;gap:5px}
.player-chip{display:flex;align-items:center;gap:5px;
  background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);
  border-radius:20px;padding:5px 10px 5px 5px;font-size:11px;
  transition:all 0.2s;}
.player-chip:hover{background:rgba(255,255,255,0.06);border-color:rgba(255,255,255,0.12);}
.player-chip .num{font-family:var(--font-mono);font-size:10px;font-weight:700;
  width:22px;height:22px;border-radius:50%;background:rgba(13,140,60,0.2);
  display:flex;align-items:center;justify-content:center;color:var(--pitch-bright)}
.player-chip .pname{color:var(--text);max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.player-chip.sub{opacity:0.55}
.bench-section{margin-top:10px;border-top:1px solid rgba(255,255,255,0.04);padding-top:10px}
.bench-section .bench-label{font-size:10px;color:var(--text-dim);text-transform:uppercase;
  letter-spacing:1px;margin-bottom:6px}

/* ═══ 事件时间线 ═══ */
.event-list{position:relative;padding-left:28px}
.event-list::before{content:'';position:absolute;left:10px;top:0;bottom:0;
  width:1px;background:rgba(255,255,255,0.06)}
.event-item{position:relative;padding:8px 0;display:flex;align-items:flex-start;gap:10px}
.event-item::before{content:'';position:absolute;left:-22px;top:14px;
  width:7px;height:7px;border-radius:50%;background:var(--text-dim)}
.event-item.goal::before{background:var(--gold);box-shadow:0 0 6px var(--glow-gold)}
.event-item.card-y::before{background:#f0c040}
.event-item.card-r::before{background:#e03030}
.event-item.sub::before{background:var(--pitch)}
.event-time{font-family:var(--font-mono);font-size:10px;color:var(--text-dim);
  min-width:40px;text-align:right}
.event-icon{font-size:13px;min-width:20px;text-align:center}
.event-text{font-size:12px;color:var(--text);flex:1;line-height:1.4}

/* ═══ 加载/状态 ═══ */
.loading-state{text-align:center;padding:60px 20px;color:var(--text-dim)}
.loading-spinner{width:32px;height:32px;border:3px solid rgba(255,255,255,0.1);
  border-top-color:var(--pitch);border-radius:50%;margin:0 auto 14px;
  animation:spin 0.8s linear infinite}
.error-state{text-align:center;padding:40px 20px;color:var(--accent-red);
  background:var(--card);border-radius:var(--radius);margin-bottom:14px}
.empty-state{text-align:center;padding:40px 20px;color:var(--text-dim)}

/* ═══ 动画 ═══ */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes scoreBreath{0%,100%{box-shadow:0 0 0 0 rgba(13,140,60,0.3)}50%{box-shadow:0 0 0 8px rgba(13,140,60,0)}}
@keyframes livePulseSm{0%,100%{opacity:1}50%{opacity:0.3}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeUp 0.5s ease both}

footer{text-align:center;padding:32px 0;border-top:1px solid rgba(255,255,255,0.04);
  color:var(--text-dim);font-size:12px;position:relative;z-index:1;margin-top:30px}
footer strong{color:var(--gold)}

/* ═══ 响应式 ═══ */
@media(max-width:768px){
  .lineups-grid{grid-template-columns:1fr}
  .match-teams-row{gap:10px}
  .score-box{font-size:28px;padding:4px 12px;min-width:60px}
  .match-tab{font-size:9px;padding:6px 10px}
}
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="worldcuppro.html" class="nav-back">← 返回主页</a>
    <a href="worldcuppro.html" class="nav-logo">⚽ WC26</a>
    <span style="font-size:12px;color:var(--text-dim)">比赛数据</span>
  </div>
</nav>

<div class="container">
  <!-- ═══ 比赛选择器 ═══ -->
  <section class="selector-section fade-in">
    <div class="match-tabs" id="matchTabs">
      <div class="loading-state" style="padding:10px">加载比赛中...</div>
    </div>
  </section>

  <!-- ═══ 主体内容 ═══ -->
  <div id="mainContent">
    <div class="loading-state">
      <div class="loading-spinner"></div>
      正在获取比赛数据...
    </div>
  </div>
</div>

<footer>FIFA World Cup 2026 · 数据来源: ESPN · 仅供娱乐</footer>

<script>
/* ════════════════════════════════════════════════════
   1. 数据获取 — ESPN 公开 API (无需认证)
   ════════════════════════════════════════════════════ */
var ESPN_BASE = 'https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world';

/* ESPN 英文队名 → 中文 */
var TEAM_CN = {
  'austria':'奥地利','jordan':'约旦','portugal':'葡萄牙','dr congo':'刚果(金)',
  'england':'英格兰','croatia':'克罗地亚','ghana':'加纳','panama':'巴拿马',
  'uzbekistan':'乌兹别克斯坦','colombia':'哥伦比亚','mexico':'墨西哥',
  'south africa':'南非','south korea':'韩国','czechia':'捷克','canada':'加拿大',
  'bosnia and herzegovina':'波黑','bosnia':'波黑','united states':'美国',
  'paraguay':'巴拉圭','qatar':'卡塔尔','switzerland':'瑞士','brazil':'巴西',
  'morocco':'摩洛哥','haiti':'海地','scotland':'苏格兰','australia':'澳大利亚',
  'turkey':'土耳其','germany':'德国','curacao':'库拉索','netherlands':'荷兰',
  'japan':'日本','sweden':'瑞典','tunisia':'突尼斯','ivory coast':'科特迪瓦',
  'ecuador':'厄瓜多尔','spain':'西班牙','cape verde':'佛得角','belgium':'比利时',
  'egypt':'埃及','saudi arabia':'沙特','uruguay':'乌拉圭','iran':'伊朗',
  'new zealand':'新西兰','france':'法国','senegal':'塞内加尔','iraq':'伊拉克',
  'norway':'挪威','argentina':'阿根廷','algeria':'阿尔及利亚'
};

function tcn(name) {
  var low = (name || '').toLowerCase().trim();
  if (TEAM_CN[low]) return TEAM_CN[low];
  for (var k in TEAM_CN) { if (low.indexOf(k) >= 0 || k.indexOf(low) >= 0) return TEAM_CN[k]; }
  return name;
}

/* 国旗emoji */
var FLAGS = {mx:'🇲🇽',za:'🇿🇦',kr:'🇰🇷',cz:'🇨🇿',ca:'🇨🇦',ba:'🇧🇦',qa:'🇶🇦',ch:'🇨🇭',
  br:'🇧🇷',ma:'🇲🇦',ht:'🇭🇹','gb-sct':'🏴󠁧󠁢󠁳󠁣󠁴󠁿',us:'🇺🇸',py:'🇵🇾',au:'🇦🇺',tr:'🇹🇷',
  de:'🇩🇪',cw:'🇨🇼',ci:'🇨🇮',ec:'🇪🇨',nl:'🇳🇱',jp:'🇯🇵',se:'🇸🇪',tn:'🇹🇳',
  be:'🇧🇪',eg:'🇪🇬',ir:'🇮🇷',nz:'🇳🇿',es:'🇪🇸',cv:'🇨🇻',sa:'🇸🇦',uy:'🇺🇾',
  fr:'🇫🇷',sn:'🇸🇳',iq:'🇮🇶',no:'🇳🇴',ar:'🇦🇷',dz:'🇩🇿',at:'🇦🇹',jo:'🇯🇴',
  pt:'🇵🇹',cd:'🇨🇩',uz:'🇺🇿',co:'🇨🇴','gb-eng':'🏴󠁧󠁢󠁥󠁮󠁧󠁿',hr:'🇭🇷',gh:'🇬🇭',pa:'🇵🇦'};

/* ESPN 队名 → 国旗 emoji */
function espnFlag(name) {
  var low = (name || '').toLowerCase().trim();
  var map = {austria:'🇦🇹',jordan:'🇯🇴',portugal:'🇵🇹','dr congo':'🇨🇩',
    england:'🏴󠁧󠁢󠁥󠁮󠁧󠁿',croatia:'🇭🇷',ghana:'🇬🇭',panama:'🇵🇦',uzbekistan:'🇺🇿',
    colombia:'🇨🇴',mexico:'🇲🇽','south africa':'🇿🇦','south korea':'🇰🇷',
    czechia:'🇨🇿',canada:'🇨🇦','bosnia and herzegovina':'🇧🇦',bosnia:'🇧🇦',
    'united states':'🇺🇸',paraguay:'🇵🇾',qatar:'🇶🇦',switzerland:'🇨🇭',
    brazil:'🇧🇷',morocco:'🇲🇦',haiti:'🇭🇹',scotland:'🏴󠁧󠁢󠁳󠁣󠁴󠁿',
    australia:'🇦🇺',turkey:'🇹🇷',germany:'🇩🇪',curacao:'🇨🇼',
    'ivory coast':'🇨🇮',ecuador:'🇪🇨',spain:'🇪🇸','cape verde':'🇨🇻',
    belgium:'🇧🇪',egypt:'🇪🇬','saudi arabia':'🇸🇦',uruguay:'🇺🇾',
    'new zealand':'🇳🇿',france:'🇫🇷',senegal:'🇸🇳',norway:'🇳🇴',
    argentina:'🇦🇷',algeria:'🇩🇿',netherlands:'🇳🇱',japan:'🇯🇵',
    sweden:'🇸🇪',tunisia:'🇹🇳',iran:'🇮🇷',iraq:'🇮🇶'};
  for (var k in map) { if (low.indexOf(k) >= 0 || k.indexOf(low) >= 0) return map[k]; }
  return '🏴';
}

/* 位置 → 中文 (缩写来自 ESPN roster) */
var POS_CN = {G:'门将','CD-L':'左中卫','CD-R':'右中卫',LB:'左后卫',RB:'右后卫',
  CB:'中后卫',CDM:'后腰',CM:'中场',CAM:'前腰',LM:'左中场',RM:'右中场',
  LW:'左边锋',RW:'右边锋',ST:'前锋',LF:'左前锋',RF:'右前锋','CF':'中锋'};

/* ─── 日期格式化 ─── */
function fmtDate(iso) {
  if (!iso) return '';
  var d = new Date(iso);
  return (d.getMonth() + 1) + '月' + d.getDate() + '日 '
    + String(d.getHours()).padStart(2, '0') + ':'
    + String(d.getMinutes()).padStart(2, '0');
}

/* ─── 获取今天日期字符串 YYYYMMDD ─── */
function todayStr() {
  var d = new Date();
  return d.getFullYear() + String(d.getMonth()+1).padStart(2,'0')
    + String(d.getDate()).padStart(2,'0');
}

var matchCache = {};

/* ─── 获取今天所有比赛 ─── */
async function fetchMatches() {
  var dates = [todayStr()];
  var y = new Date(Date.now() - 86400000);
  dates.push(y.getFullYear() + String(y.getMonth()+1).padStart(2,'0')
    + String(y.getDate()).padStart(2,'0'));
  var all = [];
  for (var di = 0; di < dates.length; di++) {
    try {
      var r = await fetch(ESPN_BASE + '/scoreboard?dates=' + dates[di]);
      if (r.ok) { var d = await r.json(); if (d.events) all = all.concat(d.events); }
    } catch(e) {}
  }
  return all;
}

/* ─── 获取比赛摘要 ─── */
async function fetchSummary(eventId) {
  if (matchCache[eventId] && matchCache[eventId].summary) return matchCache[eventId].summary;
  try {
    var r = await fetch(ESPN_BASE + '/summary?event=' + eventId);
    if (!r.ok) return null;
    var d = await r.json();
    if (!matchCache[eventId]) matchCache[eventId] = {};
    matchCache[eventId].summary = d;
    matchCache[eventId].ts = Date.now();
    return d;
  } catch(e) { return null; }
}

/* ════════════════════════════════════════════════════
   2. 渲染
   ════════════════════════════════════════════════════ */

/* ─── 比赛选择tabs ─── */
function renderTabs(events, activeId) {
  var el = document.getElementById('matchTabs');
  if (!events || !events.length) {
    el.innerHTML = '<div class="empty-state">今日暂无比赛</div>'; return;
  }
  el.innerHTML = events.map(function(ev) {
    var c = ev.competitions[0];
    var hn = tcn(c.competitors[0].team.displayName);
    var an = tcn(c.competitors[1].team.displayName);
    var st = c.status.type.name;
    var live = st.indexOf('IN_PROGRESS') >= 0 || st.indexOf('HALF') >= 0
      || st.indexOf('FIRST_HALF') >= 0 || st.indexOf('SECOND_HALF') >= 0;
    var active = ev.id === activeId;
    return '<div class="match-tab' + (active ? ' active' : '') + (live ? ' live' : '')
      + '" onclick="selectMatch(\'' + ev.id + '\')">'
      + (live ? '<span class="tab-dot"></span>' : '')
      + hn + ' ' + c.competitors[0].score + '-' + c.competitors[1].score + ' ' + an
      + '</div>';
  }).join('');
}

/* ─── 主内容渲染 ─── */
function renderContent(data) {
  var box = document.getElementById('mainContent');
  if (!data) { box.innerHTML = '<div class="error-state">无法加载比赛数据</div>'; return; }

  var s = data.summary;
  if (!s) { box.innerHTML = '<div class="error-state">比赛数据暂不可用</div>'; return; }

  var hdr = s.header;
  var comp = hdr && hdr.competitions ? hdr.competitions[0] : null;
  if (!comp) { box.innerHTML = '<div class="empty-state">比赛数据加载中...</div>'; return; }

  var home = comp.competitors[0], away = comp.competitors[1];
  var hn = tcn(home.team.displayName), an = tcn(away.team.displayName);
  var hf = espnFlag(home.team.displayName), af = espnFlag(away.team.displayName);
  var st = comp.status.type.name;
  var live = st.indexOf('IN_PROGRESS') >= 0 || st.indexOf('HALF') >= 0
    || st.indexOf('FIRST_HALF') >= 0 || st.indexOf('SECOND_HALF') >= 0;
  var done = comp.status.type.completed || st.indexOf('FULL_TIME') >= 0
    || st.indexOf('FINAL') >= 0;
  var statusText = done ? '已结束' : (live ? (st.indexOf('HALF') >= 0 ? '中场休息' : '直播中') : '未开始');
  var clock = comp.status.displayClock || '';
  var venue = (s.gameInfo && s.gameInfo.venue) ? s.gameInfo.venue.fullName : '';

  /* ─── 比赛头部 ─── */
  var html = '<section class="match-header fade-in">'
    + '<div class="match-header-top"><span class="match-stage">' + venue + '</span></div>'
    + '<div class="match-teams-row">'
    + '<div class="team-col"><span class="flag">' + hf + '</span><div class="name">' + hn + '</div></div>'
    + '<div class="score-col"><div class="score-box' + (live ? ' live' : '') + '">'
    + home.score + ' : ' + away.score + '</div></div>'
    + '<div class="team-col"><span class="flag">' + af + '</span><div class="name">' + an + '</div></div>'
    + '</div>'
    + '<div class="match-meta">'
    + '<span>' + (live ? '<span style="color:#0fa84a">●</span> ' : '')
    + statusText + (clock ? ' ' + clock : '') + '</span>'
    + (data.evt ? '<span>' + fmtDate(data.evt.date) + ' 北京时间</span>' : '')
    + '</div></section>';

  /* ─── 统计数据 ─── */
  var bs = s.boxscore;
  if (bs && bs.teams && bs.teams.length >= 2) {
    var hs = bs.teams[0].statistics || [], as = bs.teams[1].statistics || [];
    var keys = ['possessionPct','totalShots','shotsOnTarget','totalPasses','passPct',
      'foulsCommitted','wonCorners','offsides','yellowCards','redCards','saves'];
    var labels = {possessionPct:'控球率',totalShots:'射门',shotsOnTarget:'射正',
      totalPasses:'传球',passPct:'传球成功率',foulsCommitted:'犯规',
      wonCorners:'角球',offsides:'越位',yellowCards:'黄牌',redCards:'红牌',saves:'扑救'};
    var isPctRaw = {passPct:true,shotPct:true,crossPct:true}; // ESPN返回0-1, 需×100
    var isPctDirect = {possessionPct:true}; // ESPN返回0-100, 直接用

    html += '<section class="stats-card fade-in" style="animation-delay:0.1s"><h3>📊 比赛数据</h3>';

    for (var si = 0; si < keys.length; si++) {
      var key = keys[si];
      var hv = null, av = null;
      for (var hi = 0; hi < hs.length; hi++) { if (hs[hi].name === key) { hv = hs[hi].displayValue; break; } }
      for (var ai = 0; ai < as.length; ai++) { if (as[ai].name === key) { av = as[ai].displayValue; break; } }
      if (hv == null && av == null) continue;

      var hN = parseFloat(hv) || 0, aN = parseFloat(av) || 0;
      var tot = hN + aN || 1;
      var isPct = isPctRaw[key] || isPctDirect[key];
      var hDisp = hN, aDisp = aN;
      if (isPctRaw[key]) { hDisp = hN * 100; aDisp = aN * 100; } // 0-1 → 0-100
      var hp = isPctDirect[key] ? hN : (isPctRaw[key] ? hDisp : (hN / tot * 100));
      var ap = isPctDirect[key] ? aN : (isPctRaw[key] ? aDisp : (aN / tot * 100));
      var hd = isPct ? (hDisp.toFixed(1) + '%') : (hN > 999 ? (hN/1000).toFixed(1) + 'k' : '' + hN);
      var ad = isPct ? (aDisp.toFixed(1) + '%') : (aN > 999 ? (aN/1000).toFixed(1) + 'k' : '' + aN);

      html += '<div class="stats-row">'
        + '<span class="stats-val-h">' + hd + '</span>'
        + '<span class="stats-vs">' + labels[key] + '</span>'
        + '<span class="stats-val-a">' + ad + '</span>'
        + '<div class="stats-bar-wrap" style="grid-column:1/-1">'
        + '<div class="stats-bar-h" style="width:' + hp.toFixed(1) + '%"></div>'
        + '<div class="stats-bar-a" style="width:' + ap.toFixed(1) + '%"></div>'
        + '</div></div>';
    }
    html += '</section>';
  }

  /* ─── 阵容 ─── */
  var rosters = s.rosters;
  if (rosters && rosters.length >= 2) {
    var rh = rosters[0], ra = rosters[1];
    html += '<section class="stats-card fade-in" style="animation-delay:0.15s"><h3>👥 首发阵容</h3>'
      + '<div class="lineups-grid">';

    [{r:rh, flag:hf, name:hn, fm:rh.formation||'?'},
     {r:ra, flag:af, name:an, fm:ra.formation||'?'}].forEach(function(t) {
      var starters = (t.r.roster || []).filter(function(p) { return p.starter; });
      var subs = (t.r.roster || []).filter(function(p) { return !p.starter; });

      html += '<div class="lineup-col"><h4>' + t.flag + ' ' + t.name
        + ' <span class="fm">' + t.fm + '</span></h4>'
        + '<div class="lineup-list">'
        + starters.map(function(p) {
          return '<div class="player-chip">'
            + '<span class="num">' + (p.jersey || '?') + '</span>'
            + '<span class="pname" title="' + p.athlete.displayName + ' · '
            + (POS_CN[p.position.abbreviation] || p.position.displayName) + '">'
            + p.athlete.displayName + '</span></div>';
        }).join('') + '</div>';

      if (subs.length > 0) {
        html += '<div class="bench-section"><div class="bench-label">🔄 替补</div>'
          + '<div class="lineup-list">'
          + subs.map(function(p) {
            return '<div class="player-chip sub"><span class="num">'
              + (p.jersey || '?') + '</span><span class="pname">'
              + p.athlete.displayName + '</span></div>';
          }).join('') + '</div></div>';
      }
      html += '</div>';
    });
    html += '</div></section>';
  }

  /* ─── 事件时间线 ─── */
  var events = s.keyEvents || [];
  var significant = events.filter(function(ev) {
    if (!ev.type || !ev.type.text) return false;
    var t = ev.type.text;
    return t === 'Goal' || t.indexOf('Yellow') >= 0 || t.indexOf('Red') >= 0
      || t.indexOf('Substitution') >= 0 || t.indexOf('Penalty') >= 0
      || t === 'Halftime' || t === 'End Regular Time';
  });

  if (significant.length > 0) {
    html += '<section class="stats-card fade-in" style="animation-delay:0.2s"><h3>⏱️ 比赛事件</h3>'
      + '<div class="event-list">';

    for (var ei = 0; ei < significant.length; ei++) {
      var ev = significant[ei];
      var type = ev.type.text;
      var isGoal = type === 'Goal';
      var isRed = type.indexOf('Red') >= 0;
      var isYel = type.indexOf('Yellow') >= 0;
      var isSub = type.indexOf('Substitution') >= 0;

      var cls = isGoal ? 'goal' : (isRed ? 'card-r' : (isYel ? 'card-y' : (isSub ? 'sub' : '')));
      var icon = isGoal ? '⚽' : (isRed ? '🟥' : (isYel ? '🟨' : (isSub ? '🔄' : '●')));
      var cText = ev.clock && ev.clock.displayValue ? ev.clock.displayValue : '';
      var txt = ev.text || ev.shortText || '';

      html += '<div class="event-item ' + cls + '">'
        + '<span class="event-time">' + cText + '</span>'
        + '<span class="event-icon">' + icon + '</span>'
        + '<span class="event-text">' + txt + '</span></div>';
    }
    html += '</div></section>';
  }

  /* ─── 全场最佳 (仅已结束) ─── */
  if (done) {
    var motm = s.manOfTheMatch;
    if (motm) {
      html += '<section class="stats-card fade-in" style="animation-delay:0.25s"><h3>⭐ 全场最佳球员</h3>'
        + '<div style="display:flex;align-items:center;gap:14px;padding:14px">'
        + '<span style="font-size:44px">⭐</span>'
        + '<div><div style="font-size:20px;font-weight:700;color:var(--gold)">'
        + motm.displayName + '</div>'
        + '<div style="font-size:11px;color:var(--text-dim);margin-top:2px">'
        + 'Man of the Match</div></div></div></section>';
    }
  }

  box.innerHTML = html;
}

/* ════════════════════════════════════════════════════
   3. 主逻辑
   ════════════════════════════════════════════════════ */
var allEvents = [];
var activeEvtId = null;

async function selectMatch(eventId) {
  activeEvtId = eventId;
  renderTabs(allEvents, eventId);
  document.getElementById('mainContent').innerHTML
    = '<div class="loading-state"><div class="loading-spinner"></div>获取中...</div>';

  var evt = null;
  for (var i = 0; i < allEvents.length; i++) {
    if (allEvents[i].id === eventId) { evt = allEvents[i]; break; }
  }

  try {
    var summary = await fetchSummary(eventId);
    renderContent({summary: summary, evt: evt});
  } catch(e) {
    document.getElementById('mainContent').innerHTML
      = '<div class="error-state">加载失败: ' + e.message + '</div>';
  }
}

async function init() {
  try { allEvents = await fetchMatches(); } catch(e) { allEvents = []; }

  if (!allEvents.length) {
    document.getElementById('matchTabs').innerHTML = '<div class="empty-state">今日暂无比赛</div>';
    document.getElementById('mainContent').innerHTML
      = '<div class="empty-state">请在有比赛日查看实时数据<br><small>数据来源: ESPN</small></div>';
    return;
  }

  // 默认选正在进行的，否则第一场
  var defId = allEvents[0].id;
  for (var i = 0; i < allEvents.length; i++) {
    var st = allEvents[i].competitions[0].status.type.name;
    if (st.indexOf('IN_PROGRESS') >= 0 || st.indexOf('HALF') >= 0
      || st.indexOf('FIRST_HALF') >= 0 || st.indexOf('SECOND_HALF') >= 0) {
      defId = allEvents[i].id; break;
    }
  }

  renderTabs(allEvents, defId);
  await selectMatch(defId);

  // 进行中比赛每60秒刷新
  setInterval(async function() {
    try { allEvents = await fetchMatches(); } catch(e) {}
    if (activeEvtId) {
      try {
        var s = await fetchSummary(activeEvtId);
        if (s) {
          var evt = null;
          for (var i = 0; i < allEvents.length; i++) {
            if (allEvents[i].id === activeEvtId) { evt = allEvents[i]; break; }
          }
          renderContent({summary: s, evt: evt});
        }
      } catch(e) {}
    }
    if (allEvents.length) renderTabs(allEvents, activeEvtId);
  }, 60000);
}

document.addEventListener('DOMContentLoaded', init);
</script>
